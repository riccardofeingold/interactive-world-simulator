defaults:
  - base_dataset

dataset_dir: data/orcahand/large_real_dataset_5fps_135_240
horizon: 10
val_horizon: 10
aug_mode: none
n_frames: ${dataset.horizon}
observation_shape: [3, "${dataset.image_height}", "${dataset.image_width}"]
context_length: 5
frame_skip: ${dataset.skip_frame}
skip_frame: 1
pad_after: 5
pad_before: 1
rotation_rep: rotation_6d
seed: 42
val_ratio: 0.1
skip_idx: 1
use_cache: true
resolution: 128
image_height: 136
image_width: 240
obs_keys: [camera_0_color, camera_1_color]
low_dim_keys: []
delta_action: false
goal_sample: intermediate
action_mode: direct
load_mask: false
sample_index_file: sample_index.json
shape_meta:
  action:
    shape:
    - 23
  obs:
    camera_0_color:
      shape:
      - 3
      - 136
      - 240
      type: rgb
    camera_1_color:
      shape:
      - 3
      - 136
      - 240
      type: rgb
